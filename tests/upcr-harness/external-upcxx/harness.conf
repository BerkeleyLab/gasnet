BEGIN_DEFAULT_CONFIG
Flags:          
Files:          
DynamicThreads: $DEFAULT$
StaticThreads:  0
ProcPerNode:    1
CompileResult:  pass
PassExpr:       SUCCESS!
FailExpr:       ERROR
ExitCode:       0
BuildCmd:       make,notrans
AppArgs:        
AppEnv:
TimeLimit:      $DEFAULT$
RequireFeature: gasnet,upcxx
RunCmd:         ./launcher -np %N %P %A
MakeFlags:      debug   ; DBGSYM=1 OPTLEV=0
MakeFlags:      nodebug ; DBGSYM=0 OPTLEV=3
SaveOutput: 1
END_DEFAULT_CONFIG

# ------------------------------------------
# Tests to compile, but not run

TestName:	upcxx
TimeLimit:      0
CompileTimeLimit: 4 * $DEFAULT$

# ------------------------------------------
# Tests that don't use GASNet
# Can only be safely launched for smp-conduit

TestName:       hello
PassExpr:       ^Hello world
RequireFeature: gasnet,upcxx,network_smp

TestName:       future
PassExpr:       ^fib.16. = 987
RequireFeature: gasnet,upcxx,network_smp

# ------------------------------------------
# General Tests:

TestName:       hello_gasnet
PassExpr:       ^Hello from 0

TestName:       hello_upcxx
PassExpr:       ^Hello from 0

TestName:       multifile
PassExpr:       ^Hello from

TestName:       dist_object
PassExpr:       ^0.s nebr values = 1.., 2..

TestName:       rpc_barrier
PassExpr:       ^From right

TestName:       rpc_ff_ring
PassExpr:       ^Done

TestName:       rput
PassExpr:       ^get.put.X.. == X

TestName:       atomics
PassExpr:       PASS

TestName:       collectives
PassExpr:       ^Reduced value

