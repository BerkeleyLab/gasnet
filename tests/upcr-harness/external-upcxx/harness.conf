BEGIN_DEFAULT_CONFIG
Flags:          
Files:          
DynamicThreads: $DEFAULT$
StaticThreads:  0
ProcPerNode:    1
CompileResult:  pass
PassExpr:       ^Test result: SUCCESS
FailExpr:       ERROR
ExitCode:       0
BuildCmd:       make,notrans
AppArgs:        
AppEnv:
TimeLimit:      $DEFAULT$
RequireFeature: gasnet,upcxx
RunCmd:         ./launcher -np %N %P %A
MakeFlags:      debug   ; DBGSYM=1 OPTLEV=0
MakeFlags:      nodebug ; DBGSYM=0 OPTLEV=3
SaveOutput: 1
END_DEFAULT_CONFIG

# ------------------------------------------
# Tests to compile, but not run

TestName:	_upcxx
TimeLimit:      0
CompileTimeLimit: 4 * $DEFAULT$

# ------------------------------------------
# Tests that don't use GASNet
# Can only be safely launched as a local executable

TestName:       hello
RunCmd:         %P %A
PassExpr:       ^Hello world

TestName:       future
RunCmd:         %P %A

TestName:       multifile
RunCmd:         %P %A
PassExpr:       ^Hello from

# ------------------------------------------
# General Tests:

TestName:       hello_gasnet
PassExpr:       ^Hello from 0

TestName:       hello_upcxx
PassExpr:       ^Hello from 0

TestName:       dist_object

TestName:       rpc_barrier

TestName:       rpc_ff_ring

TestName:       rput

TestName:       atomics

TestName:       collectives

# ------------------------------------------
# Guide examples:

TestName:       hello-world
PassExpr:       ^Hello world from rank

TestName:       compute-pi
AppArgs:        10000
PassExpr:       ^pi estimate: 3.1

TestName:       compute-pi-multi-examples
AppArgs:        10000
PassExpr:       ^SUCCESS

