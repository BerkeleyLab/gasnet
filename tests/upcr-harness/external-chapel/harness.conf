BEGIN_DEFAULT_CONFIG
# debug harness runs  - ensure Chapel will also use a debug build:
MakeFlags:      debug; CHPL_COMM_DEBUG=1
#
Flags:          
Files:          
DynamicThreads: $DEFAULT$
StaticThreads:  0
CompileResult:  pass
PassExpr:       0
FailExpr:       ERROR
ExitCode:       0
BuildCmd:       make,notrans
AppArgs:        
AppEnv:         
RunCmd:         env --unset="BASH_FUNC_module()" %P -nl %N
TimeLimit:      $DEFAULT$
RequireFeature: gasnet,chapel
ProhibitFeature: network_smp # Not supported
# Sigh - builds are far too noisy to apply precise filters
WarningFilter:  .*?(chpl__auto_destroy_Error|error|warning|WARNING).*?
END_DEFAULT_CONFIG

# ------------------------------------------
# Tests to compile, but not run

TestName:	chapel
# Save time by building for a single conduit
# Note, however, this is only safe because Chapel defines this hook but doesn't yet set it
MakeFlags:      CHPL_GASNET_MORE_CFG_OPTIONS="--disable-auto-conduit-detect --enable-$(NETWORK)"
# TODO: "DEBUG=1" is intended, but "OPTIMIZE=0" is currently needed to avoid opt/dbg conflicts (Chapel issue #7011)
MakeFlags:      debug; DEBUG=1 OPTIMIZE=0
TimeLimit:      0
CompileTimeLimit: 4 * $DEFAULT$

# ------------------------------------------
# General tests 

TestName:       example-hello6-taskpar-dist
PassExpr:       from locale 0 of

