BEGIN_DEFAULT_CONFIG
MakeFlags:      debug; CHPL_COMM_DEBUG=1 CHPL_DEBUG=1
Flags:          
Files:          
DynamicThreads: $DEFAULT$
StaticThreads:  0
CompileResult:  pass
PassExpr:       0
FailExpr:       ERROR
ExitCode:       0
BuildCmd:       make,notrans
AppArgs:        
RunCmd:         env --unset="BASH_FUNC_module()" %P -nl %N
TimeLimit:      $DEFAULT$
RequireFeature: gasnet,chapel
AppEnv:         network_udp; GASNET_QUIET=1
# Sigh - builds are far too noisy to apply precise filters
WarningFilter:  .*?(chpl__auto_destroy_Error|error|warning|WARNING).*?
END_DEFAULT_CONFIG

# ------------------------------------------
# Tests to compile, but not run

TestName:	chapel
# TODO: CHPL_DEVELOPER=1 is _sufficient_ to avoid opt/dbg conflicts, but is it _necessary_ ?
# TODO: Currently also require gcc to have working warning suppression prgamas or else
#       we see -Werror in other third-party s/w dying on unused functions in our headers.
MakeFlags:      debug; CHPL_DEVELOPER=1
TimeLimit:      0
CompileTimeLimit: 2 * $DEFAULT$

# ------------------------------------------
# General tests 

TestName:       example-hello6-taskpar-dist
PassExpr:       from locale 0 of

