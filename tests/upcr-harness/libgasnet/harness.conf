# This suite is independent of UPC compiler:
KnownFailureAnySpec

BEGIN_DEFAULT_CONFIG
MakeFlags:      
Flags:          
Files:          $TESTNAME$.c
DynamicThreads: $DEFAULT$
StaticThreads:  0
CompileResult:  pass
PassExpr:       0
FailExpr:       ERROR
ExitCode:       0
BuildCmd:       make,notrans
AppArgs:        
CompileTimeLimit: 2 * $DEFAULT$
RequireFeature: gasnet,libgasnet_pedantic
ProcPerNode:    1
Pthreads:       0
TimeLimit:      0
END_DEFAULT_CONFIG

# setup a fresh build tree, isolated from other suites
TestName:	_configure
CompileTimeLimit: 4 * $DEFAULT$
WarningFilter:  all ; '.*' # ignore normal error/warning strings in configure output
MakeFlags:      debug   ; LIBGASNET_CONFIGURE_ARGS="!LIBGASNET_CONFIGURE_ARGS! --enable-debug"
MakeFlags:      nodebug ; LIBGASNET_CONFIGURE_ARGS="!LIBGASNET_CONFIGURE_ARGS! --disable-debug"

# libgasnet -pedantic tests
TestName:	pedantic-smp-seq
RequireFeature:	gasnet,libgasnet_pedantic,gasnet_has_smp

TestName:	pedantic-smp-par
RequireFeature:	gasnet,libgasnet_pedantic,gasnet_has_smp,pthread_support

